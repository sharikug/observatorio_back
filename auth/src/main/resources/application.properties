spring.application.name=auth

spring.datasource.url=jdbc:postgresql://localhost:5432/observatorio
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

jwt.secret=observatorio-ucundinamarca-secret-key-jwt-2026-0123456789abcdef
jwt.expiration-ms=86400000

server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

app.upload-dir=./uploads/documentos

# Modulo de IA (HU-09: entorno cerrado, solo se permite egreso al proveedor del modelo)
ia.gemini.api-key=${GEMINI_API_KEY:}
ia.gemini.base-url=https://generativelanguage.googleapis.com/v1beta
ia.gemini.modelo=gemini-2.0-flash
ia.gemini.modelo-embeddings=text-embedding-004
ia.gemini.max-fragmentos=5
ia.gemini.dominios-permitidos=generativelanguage.googleapis.com
ia.conectores.activos=postgres-observatorio
