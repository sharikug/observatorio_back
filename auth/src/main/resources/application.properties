spring.application.name=auth

spring.datasource.url=jdbc:postgresql://localhost:5432/observatorio
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always

jwt.secret=observatorio-ucundinamarca-secret-key-jwt-2026-0123456789abcdef
jwt.expiration-ms=86400000

# El registro publico solo crea cuentas de ESTUDIANTE; el rol no lo elige el cliente.
# Para levantar una cuenta de ADMINISTRADOR a mano se manda este codigo junto al
# formulario de registro. Dejarlo vacio cierra esa puerta por completo.
# En produccion: ADMIN_REGISTRATION_CODE.
app.registro.codigo-admin=${ADMIN_REGISTRATION_CODE:UC-OBS-2026-ADMIN}

server.port=8080

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB

app.upload-dir=./uploads/documentos

# Modulo de IA (HU-09: entorno cerrado, el unico egreso es el proveedor del modelo)
# La clave vive solo en la variable de entorno: nunca en el repositorio ni en el frontend.
#
# Proveedor: "gemini" (Google AI Studio, tier gratuito) u "openrouter".
# Gemini es el predeterminado porque es el unico de los dos con embeddings gratuitos,
# y el RAG los necesita. Para volver a OpenRouter: proveedor=openrouter,
# nombre=google/gemma-4-31b-it:free, embedding=openai/text-embedding-3-small,
# variable-clave=OPENROUTER_API_KEY, base-url=https://openrouter.ai/api/v1
# y dominios-permitidos=openrouter.ai
ia.modelo.proveedor=${MODEL_PROVIDER:gemini}
# flash-lite y no flash a proposito: el asistente encadena 2-3 llamadas por pregunta
# (clasificar, recuperar, componer), y el razonamiento de gemini-3.5-flash cuesta unos
# 240 tokens incluso para clasificar una frase. Medido en este proyecto: 3.5-flash daba
# 33-144 s por pregunta y devolvia 503; flash-lite da ~0.5 s por llamada y ninguno.
# Si prefieres razonamiento y aceptas la lentitud: MODEL_NAME=gemini-3.5-flash
ia.modelo.nombre=${MODEL_NAME:gemini-3.5-flash-lite}
ia.modelo.embedding=${EMBEDDING_MODEL:gemini-embedding-001}
ia.modelo.api-key=${GEMINI_API_KEY:}
ia.modelo.variable-clave=GEMINI_API_KEY
# Solo el origen: la version va en la ruta que arma el cliente. Un base-url con path
# mas una ruta que empieza en "/" depende de como los una el cliente HTTP, y un error
# ahi no se ve hasta que la API responde 404 en produccion.
ia.modelo.base-url=https://generativelanguage.googleapis.com
ia.modelo.max-fragmentos=5
ia.modelo.temperatura=0.2
ia.modelo.max-tokens=4096
# 768 de 3072: misma calidad de busqueda casi exacta y una cuarta parte de almacenamiento.
ia.modelo.dimensiones-embedding=${EMBEDDING_DIMENSIONS:768}
ia.modelo.lote-embeddings=25
# El tier gratuito da picos de demanda (503) y cortes por minuto (429). Con reintento,
# esos picos dejan de ser fallos visibles para el usuario.
ia.modelo.reintentos=3
ia.modelo.dominios-permitidos=generativelanguage.googleapis.com
ia.conectores.activos=postgres-observatorio
